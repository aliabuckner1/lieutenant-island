<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lieutenant Island Crossing</title>
<meta name="description" content="When the Lieutenant Island causeway in Wellfleet is under water — closure times for the next eight days from live NOAA tides and the weather forecast.">
<meta property="og:title" content="Lieutenant Island Crossing">
<meta property="og:description" content="When is the causeway under water? Closure times for the next eight days.">
<meta name="theme-color" content="#E9EFF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C171B" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%8A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="base.css">
<style>
.day{margin-top:14px}
.dayhead{position:sticky;top:0;z-index:2;background:var(--ground);display:flex;justify-content:space-between;align-items:baseline;
  padding:10px 2px 6px;border-bottom:1px solid var(--rule)}
.dayhead b{font-family:var(--display);font-size:18px;font-weight:700}
.dayhead span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.row{display:grid;grid-template-columns:100px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--rule-2)}
.tag{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);line-height:1.35}
.tag{display:flex;gap:7px;align-items:flex-start}
.tag .ic{margin-top:-1px;width:14px;height:14px}
.tag small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.05em}
.when{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.25}
.dur{font-size:12.5px;color:var(--muted)}
.row.near .when{font-size:14.5px;font-weight:500;color:var(--ink-2)}
.row.dry .when{font-family:var(--body);font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
.row.dry .tag{color:var(--muted)}
.dur b{font-family:var(--mono);font-weight:600;color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.s-short .row{padding:13px 2px}
.s-short .dur{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35}
.s-short .dur b{font-family:inherit;font-weight:inherit;color:inherit}
.s-short .when{font-family:var(--body);font-size:18px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.s-short .row.near .when{font-size:15px;font-weight:500}
.key .ic{width:14px;height:14px}
.none{padding:11px 2px 11px 112px;color:var(--muted);font-size:14px;border-bottom:1px solid var(--rule-2)}

/* ---- tap a tide for details ---- */
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.hint{font-size:12.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--rule);background:var(--surface);color:var(--ink);
  border-radius:99px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn .ic{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.wide{width:100%;justify-content:center;padding:12px 16px;font-size:15.5px;margin-top:18px}
.btn:disabled{opacity:.4;cursor:default}
.row[role=button]{grid-template-columns:100px minmax(0,1fr) auto 8px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s}
@media (hover:hover){.row[role=button]:hover{background:var(--surface-2)}}
.row[role=button]:active{background:var(--sunk)}
.chev{width:8px;height:13px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* very narrow screens (a small phone, or the page zoomed in): slimmer part-of-day column so nothing spills sideways */
@media (max-width:330px){.row[role=button]{grid-template-columns:72px minmax(0,1fr) auto 8px;gap:8px}.tag .ic{display:none}.none{padding-left:82px}}

dialog.sheet{top:auto;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:460px;max-height:90vh;max-height:90dvh;
  padding:0;border:0;border-radius:18px 18px 0 0;background:var(--surface);color:var(--ink);
  box-shadow:0 -10px 40px #0f202740;overflow:auto;overscroll-behavior:contain}
dialog.sheet[open]{animation:sheetUp .22s ease-out}
dialog.sheet::backdrop{background:#0b161a73}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
@media (min-width:640px){dialog.sheet{top:0;bottom:0;margin:auto;height:fit-content;border-radius:18px}}
html:has(dialog[open]){overflow:hidden}
.sh{padding:6px 18px calc(24px + env(safe-area-inset-bottom))}
.grab{width:38px;height:4px;border-radius:9px;background:var(--rule);margin:4px auto 10px}
.shhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.kicker{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sh h2{font-family:var(--display);font-size:22px;line-height:1.2;margin:2px 0 0}
.x{border:0;background:var(--surface-2);color:var(--ink-2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.verdict{margin-top:14px;border-radius:12px;padding:11px 14px}
.verdict b{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600}
.verdict small{display:block;font-size:13.5px;color:var(--ink-2);margin-top:2px;line-height:1.4}
.verdict.near{border:1.5px dashed var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stat span{display:block;font-size:11.5px;color:var(--muted)}
.stat b{display:block;font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.stat small{font-family:var(--mono);font-size:11px;color:var(--muted)}
/* the road isn't a third measurement, it's the fixed line both are judged against */
.roadref{margin-top:10px;font-size:13px;color:var(--muted)}
.roadref b{font-family:var(--mono);font-weight:600;color:var(--ink-2)}
.sec{margin-top:22px}
.sec h3{font-size:17px;font-weight:700;line-height:1.3;margin:0}
.cap{font-size:12.5px;color:var(--muted);margin:4px 0 4px;line-height:1.4}
.why{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule-2)}
.why b{display:block;font-size:14.5px;font-weight:600}
.why small{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.amt{font-family:var(--mono);font-weight:600;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.amt.up{color:var(--shut-ink)}
.amt.down{color:var(--clear-ink)}
.fine{font-size:12px;color:var(--muted);margin:14px 0 0;line-height:1.45}

/* ---- report the road ---- */
fieldset{border:0;margin:0;padding:0;min-width:0}
.choices{display:grid;gap:8px;margin-top:12px}
.choice{display:flex;align-items:center;gap:12px;border:1.5px solid var(--rule);border-radius:12px;padding:10px 13px;cursor:pointer;position:relative}
.choice input,.seg input{position:absolute;opacity:0;pointer-events:none}
.choice:has(input:checked){border-color:var(--accent);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--accent)}
.choice:has(input:focus-visible),.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.choice b{display:block;font-size:15.5px;font-weight:600;line-height:1.3}
.choice small{display:block;font-size:12.5px;color:var(--muted)}
.xs{width:38px;height:26px;flex:none;border-radius:5px;background:var(--surface-2)}
.xs .rd{fill:var(--ink-2);opacity:.7}
.xs .wt{fill:var(--water);opacity:.55}
.field{display:block;margin-top:16px}
.field>span,.field>legend{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;padding:0}
.field em{font-style:normal;font-weight:400;color:var(--muted)}
.seg{display:flex;gap:6px}
.seg label{flex:1 1 0;display:flex;align-items:center;justify-content:center;text-align:center;border:1.5px solid var(--rule);border-radius:99px;
  padding:8px 6px;font-size:13px;cursor:pointer;position:relative;line-height:1.25}
.seg label:has(input:checked){border-color:var(--accent);background:var(--surface-2);font-weight:600}
.inp{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--rule);border-radius:10px;padding:9px 12px;min-height:44px}
.depth{display:flex;gap:8px}
.num{position:relative;flex:0 0 104px}
.num .inp{padding-right:32px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.num span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted);pointer-events:none}
.depth .seg{flex:1}
.help{display:block;font-size:12.5px;color:var(--muted);margin-top:6px}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14.5px;color:var(--ink-2);cursor:pointer;line-height:1.35}
.check input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--accent)}
/* tapping an option twice quickly shouldn't select its text */
.choice,.check,.seg label{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.formerr{color:var(--shut-ink);font-size:13.5px;margin-top:10px}
.preview{font-family:var(--mono);font-size:11px;color:var(--warn-ink);margin:12px 0 0;text-align:center}
.thanks p{font-size:15px;margin:12px 0 0;color:var(--ink-2)}
.thanks b{color:var(--ink)}
.mine{margin-top:18px}
.mine div:not(.kicker){font-size:13.5px;color:var(--ink-2);padding:7px 0;border-bottom:1px solid var(--rule-2)}
</style>
</head>
<body>
<main class="page">
  <div class="brand">Lieutenant Island · Wellfleet</div>
  <h1>Causeway crossing</h1>
  <div class="statusline" id="status" hidden></div>
  <div class="key" id="key" hidden>
    <span><i class="dot" style="background:#fab219"></i>under 6 in</span>
    <span><i class="dot" style="background:#ec835a"></i>6–15 in</span>
    <span><i class="dot" style="background:#d03b3b"></i>15 in +</span>
    <span><i class="nk"></i>close call</span>
  </div>
  <div class="actions" id="actions" hidden>
    <span class="hint">Tap a tide for details</span>
    <button class="btn" id="reportBtn" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Report the road</button>
  </div>
  <div class="loading" id="loading">Checking the tide…</div>
  <div class="err" id="err" role="alert" hidden></div>
  <div id="days"></div>
  <p class="fresh" id="fresh"></p>
</main>
<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"><div class="sh" id="sheetBody"></div></dialog>
<script src="tide-data.js"></script>
<script>
(function(){
"use strict";
var T=window.Tides;
var STYLE="short";
document.body.classList.add("s-"+STYLE);
var M=null,ITEMS=[],CTX=null,KEY="li-road-reports";
function el(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
/* the NOAA high tide closest to a moment, within a window either side */
function highNear(M,t,win){
  var best=null;
  M.highs.forEach(function(h){var d=Math.abs(h.ms-t);if(d<=win&&(!best||d<best.d))best={d:d,h:h};});
  return best?best.h:null;
}
function highTxt(h){return "High "+T.fmtT(h.ms)+" · "+h.v.toFixed(1)+" ft";}
function tagHTML(lbl){var p=lbl.split(" → ");return p[0]+(p[1]?"<small>→ "+p[1]+"</small>":"");}
var CHEV='<svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5l5 5.5-5 5.5"/></svg>';
function rowOpen(cls,it){
  var i=ITEMS.push(it)-1;
  return '<div class="row'+(cls?" "+cls:"")+'" role="button" tabindex="0" aria-haspopup="dialog" data-i="'+i+'">';
}
function render(m){
  M=m;ITEMS=[];
  el("loading").hidden=true;el("err").hidden=true;el("status").hidden=false;el("key").hidden=false;el("actions").hidden=false;
  el("status").innerHTML=T.statusLineHTML(M);
  var n=T.nowW(),today=T.dayStart(n),first=M.series[0].ms,html="",used={};
  /* pair every closure and close call with the high tide that causes it */
  M.closures.forEach(function(c){c._h=highNear(M,c.pkMs,3*T.HOUR);if(c._h)used[c._h.ms]=1;});
  M.near.forEach(function(x){x._h=highNear(M,x.ms,2*T.HOUR);if(x._h)used[x._h.ms]=1;});
  M.order.forEach(function(k){
    var items=T.upcomingForDay(M,k,n),rel=k===today||k===today+T.DAY;
    /* high tides that don't reach the road still get a quiet row, so every high tide is listed */
    M.highs.forEach(function(h){if(T.dayStart(h.ms)===k&&h.ms>=n&&!used[h.ms])items.push({ms:h.ms,dry:h});});
    items.sort(function(a,b){return a.ms-b.ms;});
    html+='<section class="day"><div class="dayhead"><b>'+T.dayName(k,n)+'</b><span>'+
      T.fmtD(k,rel?{weekday:"short",month:"short",day:"numeric"}:{month:"short",day:"numeric"})+'</span></div>';
    if(!items.some(function(i){return i.c;})){
      var hadEarlier=k===today&&M.closures.some(function(c){return T.dayStart(c.s)===k;});
      html+='<div class="none">'+(hadEarlier?"No more closures today":"No closures — clear all day")+'</div>';
    }
    items.forEach(function(it){
      it.k=k;
      if(it.c){
        var c=it.c,inch=T.inchesOver(c),st=T.stateFor(inch),now=c.s<=n;
        html+=rowOpen("",it)+'<div class="tag">'+T.slotIcon(T.slotIndex(M,c))+'<div>'+tagHTML(T.slotLabel(M,c))+'</div></div>'+
          '<div><div class="when">'+(c.s===first?"until "+T.fmtT(c.e):T.rangeTxt(c.s,c.e))+'</div>'+
          '<div class="dur">'+(now?"under water now · ":"")+(c._h?highTxt(c._h):T.fmtDur((c.e-c.s)/T.MIN))+'</div></div>'+
          '<span class="pill" style="background:var(--'+st.cls+'-bg)"><i class="dot" style="background:'+st.color+'"></i>'+T.depthTxt(inch)+'</span>'+CHEV+'</div>';
      }else if(it.x){
        var x=it.x;
        html+=rowOpen("near",it)+'<div class="tag">'+T.slotIcon(T.slotOf(x.ms))+'<div>'+T.SLOTS[T.slotOf(x.ms)].n+'</div></div>'+
          '<div><div class="when">Close call</div><div class="dur">'+(x._h?highTxt(x._h):"could still wet the road")+'</div></div>'+
          '<span class="pill nearpill">'+T.shortBy(x)+' short</span>'+CHEV+'</div>';
      }else{
        var hd=it.dry;
        html+=rowOpen("dry",it)+'<div class="tag">'+T.slotIcon(T.slotOf(hd.ms))+'<div>'+T.SLOTS[T.slotOf(hd.ms)].n+'</div></div>'+
          '<div><div class="when">Road stays dry</div><div class="dur">'+highTxt(hd)+'</div></div><span></span>'+CHEV+'</div>';
      }
    });
    html+='</section>';
  });
  el("days").innerHTML=html;
  el("fresh").innerHTML=T.freshHTML(M);
}

/* ---- the sheet ---- */
var sheet=el("sheet");
var XIC='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
var PIN='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
function show(html){
  el("sheetBody").innerHTML=html;
  if(!sheet.open){if(sheet.showModal)sheet.showModal();else sheet.setAttribute("open","");}
  sheet.scrollTop=0;
}
function hide(){if(sheet.close)sheet.close();else sheet.removeAttribute("open");}
function headHTML(kicker,title){
  return '<div class="grab" aria-hidden="true"></div><div class="shhead"><div><div class="kicker">'+kicker+'</div>'+
    '<h2 id="sheetTitle">'+title+'</h2></div><button class="x" type="button" data-act="close" aria-label="Close">'+XIC+'</button></div>';
}
sheet.addEventListener("click",function(e){
  if(e.target===sheet){hide();return;}  /* tap on the dimmed backdrop */
  var a=e.target.closest("[data-act]");if(!a)return;
  if(a.getAttribute("data-act")==="close")hide();
  else if(a.getAttribute("data-act")==="report")openReport(CTX);
});
function rowFrom(e){var r=e.target.closest(".row[data-i]");return r?ITEMS[+r.getAttribute("data-i")]:null;}
el("days").addEventListener("click",function(e){var it=rowFrom(e);if(it)openDetail(it);});
el("days").addEventListener("keydown",function(e){
  if(e.key!=="Enter"&&e.key!==" ")return;var it=rowFrom(e);if(it){e.preventDefault();openDetail(it);}});
el("reportBtn").addEventListener("click",function(){openReport(null);});

/* ---- details for one tide ---- */
function inTxt(ft){var n=Math.round(ft*12);return n===0?"0 in":(n>0?"+":"−")+Math.abs(n)+" in";}
function amtCls(ft){var n=Math.round(ft*12);return n>0?"amt up":n<0?"amt down":"amt";}
function belowTxt(i){i=Math.abs(i);return i>=24?(i/12).toFixed(1)+" ft":Math.round(i)+" in";}
function effect(ft){return ft>0.02?"raising the water":ft<-0.02?"lowering the water":"little effect";}
var COMPASS=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
function compass(d){return COMPASS[Math.round(d/22.5)%16];}
function stat(label,val,sub){return '<div class="stat"><span>'+label+'</span><b>'+val+'</b><small>'+sub+'</small></div>';}
/* the highest forecast water within an hour of a high tide */
function peakNear(ms){
  var best=null;
  M.series.forEach(function(p){if(Math.abs(p.ms-ms)<=T.HOUR&&(!best||p.lvl>best.lvl))best=p;});
  return best||T.interp(M.series,ms);
}
/* three stages by how far ahead the tide is: 1 = within a day, leaning on the live gauge;
   2 = within 3 days, mostly the weather forecast; 3 = further out, where the forecast is less reliable */
function stageOf(E){
  var hrs=(E.ms-T.nowW())/T.HOUR,gauge=E.parts.some(function(p){return p.k==="gauge";});
  return hrs<24&&gauge?1:hrs<72?2:3;
}
var STAGE_TXT=["",
  "This is within the next 24 hours, so it leans on what the tide gauge is measuring right now, along with the wind and pressure forecast.",
  "This is within 3 days, so it mostly uses the wind and pressure forecast, which is reliable this far ahead.",
  "This is more than 3 days ahead, so the wind and pressure forecast is less reliable. Expect this to shift as the day gets closer."];
/* the typical forecast error at each stage, from replaying 2024–26 tides (scripts/backtest_fade.py) */
var STAGE_ERR=[0,3,4,5];
function capTxt(E){
  if(!E.model)return (E.beyond?"This is too far ahead for the wind forecast":"The wind and pressure forecast didn’t load")+
    ", so a typical amount is added"+(E.g>0?", along with what the tide gauge is measuring right now.":".");
  return STAGE_TXT[stageOf(E)];
}
function whyRow(lab,note,ft){
  return '<div class="why"><div><b>'+lab+'</b><small>'+note+'</small></div><span class="'+amtCls(ft)+'">'+inTxt(ft)+'</span></div>';
}
function windTxt(E){return E.wind<3?"calm":compass(E.dir)+" "+Math.round(E.wind)+" kt";}
function partsHTML(E){
  var by={};E.parts.forEach(function(p){by[p.k]=p.ft;});
  var gauge=by.gauge==null?"":whyRow("Live tide gauge",
    "How high the water is running at the gauge right now"+(E.gaugeAt?" (as of "+T.fmtT(E.gaugeAt)+")":""),by.gauge);
  if(by.typical!=null)return gauge+whyRow("Typical amount","What sea level, wind and pressure add on an average day",by.typical);
  /* next to the gauge, the weather pieces share one line so none of them looks misleadingly small */
  if(gauge)return gauge+whyRow("Wind and pressure forecast",
    "Sea level above the charts, "+Math.round(E.mb)+" mb pressure, "+windTxt(E)+" wind",by.base+by.pressure+by.wind);
  return whyRow("Sea level above the charts","NOAA’s charts still use 1983–2001 sea level, so this is added to every tide",by.base)+
    whyRow("Air pressure",Math.round(E.mb)+" mb · "+effect(by.pressure),by.pressure)+
    whyRow("Wind",windTxt(E).replace(/^c/,"C")+" · "+effect(by.wind),by.wind);
}
function openDetail(it){
  if(!M)return;
  var n=T.nowW(),first=M.series[0].ms,h,pkMs,pkLvl,slot,verdict;
  if(it.c){
    var c=it.c,inch=T.inchesOver(c),st=T.stateFor(inch),on=c.s<=n&&c.e>=n;
    h=c._h;pkMs=c.pkMs;pkLvl=c.pk;slot=T.slotLabel(M,c);
    verdict='<div class="verdict" style="background:var(--'+st.cls+'-bg)"><b><i class="dot" style="background:'+st.color+'"></i>'+
      (on?"Under water now":"Under water "+(c.s===first?"until "+T.fmtT(c.e):T.rangeTxt(c.s,c.e)))+'</b><small>'+
      (on?"Reopens "+T.whenTxt(c.e,n)+" · ":"")+"Deepest about "+T.depthTxt(inch)+" around "+T.fmtT(c.pkMs)+
      (on?"":" · "+T.fmtDur((c.e-c.s)/T.MIN)+" in all")+'</small></div>';
  }else if(it.x){
    var x=it.x;
    h=x._h;pkMs=x.ms;pkLvl=x.lvl;slot=T.SLOTS[T.slotOf(x.ms)].n;
    verdict='<div class="verdict near"><b>Close call</b><small>The forecast peak is '+T.shortBy(x)+' below the road at '+
      T.fmtT(x.ms)+' — close enough that it could still get wet</small></div>';
  }else{
    var p=peakNear(it.dry.ms);
    h=it.dry;pkMs=p.ms;pkLvl=p.lvl;slot=T.SLOTS[T.slotOf(h.ms)].n;
    verdict='<div class="verdict" style="background:var(--clear-bg)"><b><i class="dot" style="background:var(--clear)"></i>Road stays dry</b>'+
      '<small>The forecast peak is about '+belowTxt((T.ROAD-pkLvl)*12)+' below the road</small></div>';
  }
  CTX={h:h||null};
  var E=M.explain(pkMs);
  show(headHTML(T.dayName(it.k,n)+" · "+slot.toLowerCase(),h?"High tide "+T.fmtT(h.ms):"Closure")+verdict+
    '<div class="stats">'+stat("Tide chart",h?h.v.toFixed(1)+" ft":"—",h?T.fmtT(h.ms):"")+
      stat("Our forecast",pkLvl.toFixed(1)+" ft",T.fmtT(pkMs))+'</div>'+
    '<div class="roadref">Road floods above <b>'+T.ROAD.toFixed(1)+' ft</b></div>'+
    '<div class="sec"><h3>How our forecast differs from the tide chart</h3><p class="cap">'+capTxt(E)+'</p>'+
      partsHTML(E)+'</div>'+
    '<p class="fine">The forecast is usually within about '+STAGE_ERR[stageOf(E)]+' in, and the road’s height is only known to ±6 in, so give yourself margin.</p>'+
    '<button class="btn wide" type="button" data-act="report">'+PIN+'Report what you saw at the road</button>');
}

/* ---- report the road (preview: saved on this phone, not sent anywhere) ---- */
var LEVELS={dry:"Dry",wet:"Wet",across:"Wet",deep:"Wet"};  /* across/deep: preview reports saved before Dry/Wet */
var EDGES={rising:"only just coming over",falling:"only just gone off"};
function wallInput(ms){var d=new Date(ms);function p(x){return ("0"+x).slice(-2);}
  return d.getUTCFullYear()+"-"+p(d.getUTCMonth()+1)+"-"+p(d.getUTCDate())+"T"+p(d.getUTCHours())+":"+p(d.getUTCMinutes());}
function loadReports(){try{return JSON.parse(localStorage.getItem(KEY)||"[]");}catch(e){return [];}}
function inchTxt(d){return (Math.round(d*2)/2)+" in";}
/* a little cross-section of the causeway with the water at three heights */
function choice(v,title,sub,waterY){
  return '<label class="choice"><input type="radio" name="level" value="'+v+'">'+
    '<svg class="xs" viewBox="0 0 38 26" aria-hidden="true"><path class="rd" d="M0 19h8l5-6h12l5 6h8v7H0z"/>'+
    '<rect class="wt" x="0" y="'+waterY+'" width="38" height="'+(26-waterY)+'"/></svg>'+
    '<span><b>'+title+'</b><small>'+sub+'</small></span></label>';
}
function seg(name,v,label,checked){return '<label><input type="radio" name="'+name+'" value="'+v+'"'+(checked?" checked":"")+'>'+label+'</label>';}
function openReport(ctx){
  var n=T.nowW(),name="";try{name=localStorage.getItem("li-name")||"";}catch(e){}
  show(headHTML("Report the road","What did you see?")+
    '<p class="cap" style="margin-top:6px">Look at the lowest part of the road.</p>'+
    '<form id="rf" novalidate><fieldset class="choices"><legend class="sr">The road</legend>'+
      choice("dry","Dry","No water across the road",20)+
      choice("wet","Wet","Water across the road",11)+'</fieldset>'+
    /* the moment the water reaches or leaves the road pins down its height best; the wording follows the answer */
    '<label class="check" id="edgeField" hidden><input type="checkbox" name="edge"><span id="edgeTxt"></span></label>'+
    /* depth only makes sense once the road is covered */
    '<div class="field" id="depthField" hidden><span>How deep? <em>optional</em></span><div class="depth">'+
      '<label class="num"><input class="inp" type="number" name="depth" inputmode="decimal" min="0" max="60" step="0.5" aria-label="Depth in inches"><span>in</span></label>'+
      '<div class="seg" role="radiogroup" aria-label="How you got the depth">'+seg("depth_how","estimate","Estimate",true)+seg("depth_how","measured","Measured")+'</div>'+
      '</div><small class="help">At the deepest spot on the road. A rough guess is fine.</small></div>'+
    '<label class="field"><span>When</span><input class="inp" type="datetime-local" name="seen_at" value="'+wallInput(n)+'" max="'+wallInput(n)+'"></label>'+
    '<label class="field"><span>Your first name <em>optional</em></span><input class="inp" type="text" name="observer" maxlength="40" autocomplete="given-name" value="'+esc(name)+'"></label>'+
    '<div class="formerr" id="rferr" role="alert" hidden></div>'+
    '<button class="btn primary wide" type="submit" disabled>Save report</button></form>'+
    '<p class="preview">Preview — reports are saved on this phone only, not sent anywhere yet.</p>');
  var f=el("rf");
  f.addEventListener("change",function(e){
    var lvl=f.level.value;
    if(e.target.name==="level")f.edge.checked=false;  /* the box means something different for Dry and Wet */
    f.querySelector("[type=submit]").disabled=!lvl;
    el("edgeField").hidden=!lvl;
    el("edgeTxt").textContent=lvl==="dry"?"The water had only just gone off the road":"The water was only just coming over the road";
    el("depthField").hidden=lvl!=="wet"||f.edge.checked;
  });
  f.addEventListener("submit",function(e){e.preventDefault();saveReport(f,ctx);});
}
function saveReport(f,ctx){
  var err=el("rferr"),v=f.seen_at.value,ms=v?T.parseWall(v):NaN,n=T.nowW(),S=M.series;
  function fail(msg){err.hidden=false;err.textContent=msg;}
  if(!f.level.value)return fail("Pick what you saw.");
  var wet=f.level.value!=="dry",dv=f.depth.value.trim(),depth=null;
  if(wet&&!f.edge.checked&&dv!==""){depth=+dv;if(!(depth>=0&&depth<=60))return fail("Depth should be a number of inches, from 0 to 60.");}
  if(isNaN(ms))return fail("Pick when you saw it.");
  if(ms>n+5*T.MIN)return fail("That time hasn’t happened yet.");
  var fc=ms>=S[0].ms&&ms<=S[S.length-1].ms?T.interp(S,ms):null,name=f.observer.value.trim();
  var rec={seen_at:v,level:f.level.value,depth_in:depth,depth_measured:depth==null?null:f.depth_how.value==="measured",
    edge:f.edge.checked?(wet?"rising":"falling"):null,observer:name||null,
    forecast_in:fc?Math.round(fc.inch*10)/10:null,high_tide:ctx&&ctx.h?wallInput(ctx.h.ms):null,
    reported_at:new Date().toISOString()};
  var all=loadReports();all.push(rec);
  try{localStorage.setItem(KEY,JSON.stringify(all));if(name)localStorage.setItem("li-name",name);}catch(e){}
  showThanks(rec,fc,all);
}
/* how a report compares with what the forecast had at that moment */
function compareTxt(rec,fc){
  var wet=rec.level!=="dry",fwet=fc.inch>0,d=rec.depth_in;
  if(wet&&fwet&&d!=null){var off=d-fc.inch;
    return Math.abs(off)<=3?"That’s close to the forecast.":
      "That’s "+Math.round(Math.abs(off))+" in "+(off>0?"deeper":"shallower")+" than the forecast, which helps pin down the road’s real height.";}
  if(Math.abs(fc.inch)<=6)return "That’s close to the edge, which is exactly where reports help pin down the road’s real height.";
  if(wet===fwet)return "That matches the forecast.";
  if(Math.abs(fc.inch)>24)return "That’s a long way from the forecast. Worth double-checking the time?";
  return "That’s different from the forecast, which makes it a really useful report.";
}
function showThanks(rec,fc,all){
  var ms=T.parseWall(rec.seen_at),n=T.nowW(),msg="";
  if(fc)msg='<p>At '+T.fmtT(ms)+' the forecast had the water <b>'+(fc.inch>0?"about "+T.depthTxt(fc.inch)+" over the road":
      "about "+belowTxt(fc.inch)+" below the road")+'</b>.'+
    (rec.depth_in!=null?' You '+(rec.depth_measured?"measured":"estimated")+' <b>'+inchTxt(rec.depth_in)+'</b>.':"")+
    '</p><p>'+compareTxt(rec,fc)+'</p>';
  var mine=all.slice(-5).reverse().map(function(r){var t=T.parseWall(r.seen_at);
    return '<div><b>'+T.dayName(T.dayStart(t),n)+' '+T.fmtT(t)+'</b> · '+LEVELS[r.level]+
      (r.depth_in!=null?", "+inchTxt(r.depth_in)+(r.depth_measured?" measured":" est."):"")+
      (r.edge?", "+EDGES[r.edge]:"")+(r.observer?" · "+esc(r.observer):"")+'</div>';}).join("");
  show(headHTML("Report saved","Thanks"+(rec.observer?", "+esc(rec.observer):"")+"!")+'<div class="thanks">'+msg+'</div>'+
    '<div class="mine"><div class="kicker">On this phone · '+all.length+' report'+(all.length===1?"":"s")+'</div>'+mine+'</div>'+
    '<button class="btn primary wide" type="button" data-act="close">Done</button>'+
    '<p class="preview">Preview — not sent anywhere yet.</p>');
}

T.run({render:render,
  tick:function(M){el("status").innerHTML=T.statusLineHTML(M);},
  error:function(err,M){
    if(M){el("fresh").innerHTML=T.freshHTML(M,"couldn’t refresh — showing the last good data");return;}
    el("loading").hidden=true;el("err").hidden=false;el("err").innerHTML=T.errorHTML(err);}});
})();
</script>
</body>
</html>
