<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crossing · G · Four slots every day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="base.css">
<style>
.day{margin-top:12px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 14px 8px}
.dh b{font-family:var(--display);font-size:17px;font-weight:700}
.dh span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sl{display:grid;grid-template-columns:104px 1fr auto;align-items:center;gap:10px;padding:7px 14px;border-top:1px solid var(--rule-2);min-height:46px}
.sl .nm .ic{color:var(--ink-2)}
.cardhi{padding:9px 14px 10px;border-top:1px solid var(--rule-2)}
.sl .nm{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink-2);line-height:1.2}
.sl .nm small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--muted);font-weight:400;margin-top:1px}
.sl .v{font-family:var(--mono);font-size:15.5px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sl .v.cont{font-family:var(--body);font-size:13px;font-weight:500;color:var(--ink-2);letter-spacing:0}
.sl .v.clear{font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}
.sl.dim{opacity:.38}
.dd{font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
</style>
</head>
<body>
<main class="page">
  <div class="brand">Lieutenant Island · Wellfleet</div>
  <h1>Causeway crossing</h1>
  <div class="statusline" id="status" hidden></div>
  <div class="key" id="key" hidden>
    <span><i class="dot" style="background:#fab219"></i>under 6 in</span>
    <span><i class="dot" style="background:#ec835a"></i>6–15 in</span>
    <span><i class="dot" style="background:#d03b3b"></i>15 in +</span>
    <span><i class="nk"></i>close call</span>
  </div>
  <div class="loading" id="loading">Checking the tide…</div>
  <div class="err" id="err" role="alert" hidden></div>
  <div id="days"></div>
  <p class="fresh" id="fresh"></p>
</main>
<script src="tide-data.js"></script>
<script>
(function(){
"use strict";
var T=window.Tides;
function el(id){return document.getElementById(id);}
function render(M){
  el("loading").hidden=true;el("err").hidden=true;el("status").hidden=false;el("key").hidden=false;
  el("status").innerHTML=T.statusLineHTML(M);
  var n=T.nowW(),today=T.dayStart(n),first=M.series[0].ms,html="";
  M.order.forEach(function(k){
    var rel=k===today||k===today+T.DAY;
    html+='<section class="day"><div class="dh"><b>'+T.dayName(k,n)+'</b><span>'+
      T.fmtD(k,rel?{weekday:"short",month:"short",day:"numeric"}:{month:"short",day:"numeric"})+'</span></div>';
    for(var b=0;b<4;b++){
      var si=T.slotInfo(M,k,b),S=T.SLOTS[b],style="",val,right="";
      if(si.over.length)style=' style="background:var(--'+T.stateFor(si.worst).cls+'-bg)"';
      if(si.starts.length){
        var c=si.starts[0],inch=T.inchesOver(c),st=T.stateFor(inch);
        val='<div class="v">'+(c.s===first?"until "+T.fmtT(c.e):T.rangeTxt(c.s,c.e))+'</div>';
        right='<span class="dd"><i class="dot" style="background:'+st.color+'"></i>'+T.depthTxt(inch)+'</span>';
      }else if(si.over.length){
        val='<div class="v cont">still underwater until '+T.fmtT(si.over[0].e)+'</div>';
      }else if(si.near.length){
        val='<div class="v cont">close call at '+T.fmtT(si.near[0].ms)+'</div>';
        right='<span class="pill nearpill">'+T.shortBy(si.near[0])+' short</span>';
      }else val='<div class="v clear">clear</div>';
      html+='<div class="sl'+(si.z<=n?" dim":"")+'"'+style+'><div class="nm">'+T.slotIcon(b)+'<div>'+S.n+'<small>'+S.sub+'</small></div></div>'+val+'<div>'+right+'</div></div>';
    }
    var hi=T.highsHTML(M,k,n);if(hi)html+='<div class="hiline cardhi">'+hi+'</div>';
    html+='</section>';
  });
  el("days").innerHTML=html;
  el("fresh").innerHTML=T.freshHTML(M);
}
T.run({render:render,
  tick:function(M){el("status").innerHTML=T.statusLineHTML(M);},
  error:function(err,M){
    if(M){el("fresh").innerHTML=T.freshHTML(M,"couldn’t refresh — showing the last good data");return;}
    el("loading").hidden=true;el("err").hidden=false;el("err").innerHTML=T.errorHTML(err);}});
})();
</script>
</body>
</html>
