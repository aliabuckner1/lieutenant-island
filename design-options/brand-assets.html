<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lt. Island Tides: icon and link preview</title>
<!-- Source for the PNGs in site/: the home-screen icon (#icon) and the link-preview card (#og, 1200×630).
     To regenerate, screenshot each element at its native size with a headless browser:
       #icon at 512, 192 and 180 px (apple-touch-icon) and 32 px (favicon); #og at 1200×630 → site/og-image.png -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@700&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;500&display=swap">
<style>
body{margin:0;background:#cfd8db;font-family:"Public Sans",sans-serif}
.stage{display:flex;flex-wrap:wrap;gap:40px;padding:40px;align-items:flex-start}
#icon{width:512px;height:512px;display:block}
#og{width:1200px;height:630px;box-sizing:border-box;background:#E9EFF1;display:flex;align-items:center;gap:64px;padding:0 90px;color:#0F2027}
#og svg{width:260px;height:260px;border-radius:58px;flex:none;box-shadow:0 10px 30px #0f20271f}
#og .eyebrow{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:26px;letter-spacing:.16em;text-transform:uppercase;color:#63808B}
#og h1{font-family:Bitter,serif;font-weight:700;font-size:92px;line-height:1.05;margin:10px 0 0;letter-spacing:-.015em;white-space:nowrap}
#og p{font-size:38px;line-height:1.25;color:#33505B;margin:18px 0 0;max-width:700px}
</style>
</head>
<body>
<div class="stage">
  <svg id="icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lt. Island Tides icon">
    <defs>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1690A0"/><stop offset="1" stop-color="#0B6E7A"/></linearGradient>
      <clipPath id="roadtop"><rect x="0" y="0" width="512" height="362"/></clipPath>
    </defs>
    <rect width="512" height="512" fill="url(#sea)"/>
    <!-- a softer swell higher up -->
    <path d="M-20 190c34 0 34-30 68-30s34 30 68 30 34-30 68-30 34 30 68 30 34-30 68-30 34 30 68 30 34-30 68-30 34 30 68 30" fill="none" stroke="#ffffff" stroke-opacity=".38" stroke-width="18" stroke-linecap="round"/>
    <!-- the road: a sandy causeway with a dashed centre line -->
    <rect x="0" y="326" width="512" height="76" fill="#F1E6CC"/>
    <path d="M0 382H512" stroke="#CDB98F" stroke-width="7" stroke-dasharray="40 28"/>
    <!-- the tide coming over the top half of the road -->
    <path d="M-20 296c34 0 34-30 68-30s34 30 68 30 34-30 68-30 34 30 68 30 34-30 68-30 34 30 68 30 34-30 68-30 34 30 68 30V362H-20Z" fill="#4FB3C8" fill-opacity=".72" clip-path="url(#roadtop)"/>
    <path d="M-20 296c34 0 34-30 68-30s34 30 68 30 34-30 68-30 34 30 68 30 34-30 68-30 34 30 68 30 34-30 68-30 34 30 68 30" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  </svg>

  <div id="og">
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
    <div>
      <div class="eyebrow">Wellfleet · Cape Cod</div>
      <h1>Lt. Island Tides</h1>
      <p>When the road is under water, for the next 8 days</p>
    </div>
  </div>
</div>
<script>
// the preview card reuses the icon artwork (with its own ids)
document.querySelector('#og svg').innerHTML = document.getElementById('icon').innerHTML
  .replace(/id="(sea|roadtop)"/g, 'id="og-$1"').replace(/url\(#(sea|roadtop)\)/g, 'url(#og-$1)');
</script>
</body>
</html>
