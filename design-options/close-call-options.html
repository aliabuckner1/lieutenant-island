<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Close call label options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../site/base.css">
<style>
.wrap{max-width:1800px;margin:0 auto;padding:26px 20px 60px}
.wrap>h1{font-size:28px}
.lede{color:var(--ink-2);max-width:80ch;margin:8px 0 0;font-size:15px}
.grid{display:flex;flex-wrap:wrap;gap:26px;margin-top:22px}
figure{margin:0;width:390px}
figcaption .id{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
figcaption b{display:block;font-family:var(--display);font-size:19px;margin-top:2px}
figcaption p{margin:4px 0 10px;font-size:13.5px;color:var(--ink-2);min-height:40px}
.phone{background:var(--ground);border:1px solid var(--rule);border-radius:26px;padding:4px 16px 10px;box-shadow:var(--shadow);overflow:hidden}

/* rows, copied from the live page */
.day{margin-top:8px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px 6px;border-bottom:1px solid var(--rule)}
.dayhead b{font-family:var(--display);font-size:18px;font-weight:700}
.dayhead span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.row{display:grid;grid-template-columns:100px minmax(0,1fr) auto 8px;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--rule-2)}
.tag{display:flex;gap:7px;align-items:flex-start;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);line-height:1.35}
.tag .ic{margin-top:-1px;width:14px;height:14px}
.when{font-size:15px;font-weight:500;color:var(--ink-2);line-height:1.25}
.row.dry .when{font-size:14px;color:var(--muted)}
.row.dry .tag{color:var(--muted)}
.dur{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35}
.none{padding:11px 2px 11px 112px;color:var(--muted);font-size:14px;border-bottom:1px solid var(--rule-2)}
.chev{width:8px;height:13px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Lieutenant Island · design options</div>
  <h1>Close calls: the “2 in short” label</h1>
  <p class="lede">A close call is a high tide our forecast puts just below the road. Each card shows Thursday and Friday from the live page,
    with a different way of saying how close it gets. Tapping the row still opens the details either way.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
(function(){
"use strict";
var MOON='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
var SUN='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
var CHEV='<svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5l5 5.5-5 5.5"/></svg>';
function pill(t){return '<span class="pill nearpill">'+t+'</span>';}
function inches(i){return i===1?'1 inch':i+' inches';}
var DAYS=[
  {name:'Thursday',date:'Sep 17',dry:['4:27am','9.0'],near:['4:37pm','9.9'],inch:2},
  {name:'Friday',date:'Sep 18',dry:['5:20am','8.6'],near:['5:30pm','9.6'],inch:1}
];
var OPTIONS=[
  {id:'1',name:'Today',about:'“2 in short”: short of what isn’t obvious, and “in” can read as the word.',
   near:function(i){return {title:'Close call',pill:pill(i+' in short')};}},
  {id:'2',name:'“2 in below”',about:'Same pill, but says which way: the water stays 2 inches below the road.',
   near:function(i){return {title:'Close call',pill:pill(i+' in below')};}},
  {id:'3',name:'“2 in to spare”',about:'Friendlier, and clearly good news: the road stays dry with 2 inches to spare.',
   near:function(i){return {title:'Close call',pill:pill(i+' in to spare')};}},
  {id:'4',name:'Number in the words, no pill',about:'Spells out “inches” in the row itself, so nothing needs decoding.',
   near:function(i){return {title:'Close call · '+inches(i)+' below'};}},
  {id:'5',name:'No number',about:'Just “Close call”. Our forecast is usually within about 4 inches, so the exact number lives in the details.',
   near:function(i){return {title:'Close call'};}}
];
document.getElementById('grid').innerHTML=OPTIONS.map(function(o){
  var rows=DAYS.map(function(d){
    var n=o.near(d.inch);
    return '<section class="day"><div class="dayhead"><b>'+d.name+'</b><span>'+d.date+'</span></div>'+
      '<div class="none">No closures — clear all day</div>'+
      '<div class="row dry"><div class="tag">'+MOON+'<div>Overnight</div></div><div><div class="when">Road stays dry</div>'+
        '<div class="dur">High '+d.dry[0]+' · '+d.dry[1]+' ft</div></div><span></span>'+CHEV+'</div>'+
      '<div class="row near"><div class="tag">'+SUN+'<div>Afternoon</div></div><div><div class="when">'+n.title+'</div>'+
        '<div class="dur">High '+d.near[0]+' · '+d.near[1]+' ft</div></div>'+(n.pill||'<span></span>')+CHEV+'</div></section>';
  }).join('');
  return '<figure><figcaption><div class="id">Option '+o.id+'</div><b>'+o.name+'</b><p>'+o.about+'</p></figcaption>'+
    '<div class="phone">'+rows+'</div></figure>';
}).join('');
})();
</script>
</body>
</html>
