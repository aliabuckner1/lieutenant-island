<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crossing · A · Tide table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="base.css">
<style>
.status{margin-top:16px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;
  padding:16px 16px 16px 14px;box-shadow:var(--shadow);display:grid;grid-template-columns:6px 1fr;gap:14px}
.status .rail{border-radius:3px}
.word{font-family:var(--display);font-size:27px;font-weight:700;line-height:1.08;letter-spacing:-.01em}
.next{margin-top:6px;font-size:16px;color:var(--ink-2)}
.next b{color:var(--ink);font-weight:600}
.sub{margin-top:3px;font-size:13.5px;color:var(--muted)}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12.5px;color:var(--ink-2)}
.key span{display:inline-flex;align-items:center;gap:6px}
.nk{width:14px;height:0;border-top:2px dashed var(--muted)}
.day{margin-top:16px}
.dayhead{position:sticky;top:0;z-index:2;background:var(--ground);display:flex;justify-content:space-between;
  align-items:baseline;padding:10px 2px 6px;border-bottom:1px solid var(--rule)}
.dayhead b{font-family:var(--display);font-size:18px;font-weight:700}
.dayhead span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--rule-2)}
.when{font-family:var(--mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dur{font-size:13px;color:var(--muted);margin-top:1px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:13.5px;
  font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.row.now{background:var(--surface);margin:6px -10px;padding:12px;border:1px solid var(--rule);border-radius:12px}
.row.past{opacity:.42}
.row.near .when{font-size:15px;font-weight:500;color:var(--ink-2)}
.pill.nearpill{border:1.5px dashed var(--muted);color:var(--ink-2);font-weight:500;padding:4px 10px}
.none{padding:12px 2px;color:var(--muted);font-size:14.5px;border-bottom:1px solid var(--rule-2)}
</style>
</head>
<body>
<main class="page">
  <div class="brand">Lieutenant Island · Wellfleet</div>
  <h1>Causeway crossing</h1>
  <div class="statusline" id="status" hidden></div>
  <div class="key" id="key" hidden>
    <span><i class="dot" style="background:#fab219"></i>under 6 in</span>
    <span><i class="dot" style="background:#ec835a"></i>6–15 in</span>
    <span><i class="dot" style="background:#d03b3b"></i>15 in +</span>
    <span><i class="nk"></i>close call</span>
  </div>
  <div class="loading" id="loading">Checking the tide…</div>
  <div class="err" id="err" role="alert" hidden></div>
  <div id="days"></div>
  <p class="fresh" id="fresh"></p>
</main>
<script src="tide-data.js"></script>
<script>
(function(){
"use strict";
var T=window.Tides;
function el(id){return document.getElementById(id);}
function statusHTML(M){return T.statusLineHTML(M);}
function render(M){
  el("loading").hidden=true;el("err").hidden=true;el("status").hidden=false;el("key").hidden=false;
  el("status").innerHTML=statusHTML(M);
  var n=T.nowW(),today=T.dayStart(n),first=M.series[0].ms,html="";
  M.order.forEach(function(k){
    var items=[];
    M.closures.forEach(function(c){if(T.dayStart(c.s)===k)items.push({ms:c.s,c:c});});
    M.near.forEach(function(x){if(T.dayStart(x.ms)===k)items.push({ms:x.ms,x:x});});
    items.sort(function(a,b){return a.ms-b.ms;});
    var rel=k===today||k===today+T.DAY;
    html+='<section class="day"><div class="dayhead"><b>'+T.dayName(k,n)+'</b><span>'+
      T.fmtD(k,rel?{weekday:"short",month:"short",day:"numeric"}:{month:"short",day:"numeric"})+'</span></div>';
    if(!items.some(function(i){return i.c;}))html+='<div class="none">No closures — clear all day</div>';
    items.forEach(function(it){
      if(it.c){
        var c=it.c,inch=T.inchesOver(c),st=T.stateFor(inch),past=c.e<n,now=c.s<=n&&c.e>=n;
        html+='<div class="row'+(past?" past":"")+(now?" now":"")+'"><div><div class="when">'+
          (c.s===first?"until ":T.fmtT(c.s)+" – ")+T.fmtT(c.e)+'</div><div class="dur">'+
          (now?"Under water now · ":"")+(c.s===first?"":T.partOfDay(c.s)+" · ")+T.fmtDur((c.e-c.s)/T.MIN)+(past?" · over":"")+'</div></div>'+
          '<span class="pill" style="background:var(--'+st.cls+'-bg)"><i class="dot" style="background:'+st.color+'"></i>'+
          T.depthTxt(inch)+'</span></div>';
      }else{
        var x=it.x;
        html+='<div class="row near'+(x.ms<n?" past":"")+'"><div><div class="when">'+T.fmtT(x.ms)+' high tide</div>'+
          '<div class="dur">Close call — could still wet the road</div></div><span class="pill nearpill">'+T.shortBy(x)+' short</span></div>';
      }
    });
    html+='</section>';
  });
  el("days").innerHTML=html;
  el("fresh").innerHTML=T.freshHTML(M);
}
T.run({render:render,
  tick:function(M){el("status").innerHTML=statusHTML(M);},
  error:function(err,M){
    if(M){el("fresh").innerHTML=T.freshHTML(M,"couldn’t refresh — showing the last good data");return;}
    el("loading").hidden=true;el("err").hidden=false;el("err").innerHTML=T.errorHTML(err);}});
})();
</script>
</body>
</html>
