<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crossing · F · Day cards with a strip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="base.css">
<style>
.dcard{margin-top:12px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.dch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 14px 8px}
.dch b{font-family:var(--display);font-size:17px;font-weight:700}
.dch span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;padding:0 10px}
.slot{border-radius:7px;background:var(--surface-2);padding:5px 3px 6px;text-align:center;min-height:44px;border:1.5px solid transparent}
.slot .si{height:17px;display:flex;justify-content:center;color:var(--ink-2)}
.slot .si .ic{width:15px;height:15px}
.cardhi{padding:9px 14px 10px;border-top:1px solid var(--rule-2);background:var(--surface-2)}
.slot .sn{font-size:9.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.slot .sv{font-family:var(--mono);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.02em;color:var(--ink)}
.slot .sv.cl{font-family:var(--body);font-weight:400;color:var(--muted);font-size:11.5px}
.slot .sv.cont{font-weight:500;color:var(--ink-2);font-size:11px}
.slot.near{background:transparent;border:1.5px dashed var(--muted)}
.slot.past{opacity:.38}
.rows{padding:0 14px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--rule-2)}
.rows .row:first-child{margin-top:9px}
.when{font-family:var(--mono);font-size:16.5px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dur{font-size:12.5px;color:var(--muted)}
.row.near .when{font-size:14.5px;font-weight:500;color:var(--ink-2)}
.clearnote{margin-top:9px;padding:10px 0 11px;border-top:1px solid var(--rule-2);font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<main class="page">
  <div class="brand">Lieutenant Island · Wellfleet</div>
  <h1>Causeway crossing</h1>
  <div class="statusline" id="status" hidden></div>
  <div class="key" id="key" hidden>
    <span><i class="dot" style="background:#fab219"></i>under 6 in</span>
    <span><i class="dot" style="background:#ec835a"></i>6–15 in</span>
    <span><i class="dot" style="background:#d03b3b"></i>15 in +</span>
    <span><i class="nk"></i>close call</span>
  </div>
  <div class="loading" id="loading">Checking the tide…</div>
  <div class="err" id="err" role="alert" hidden></div>
  <div id="days"></div>
  <p class="fresh" id="fresh"></p>
</main>
<script src="tide-data.js"></script>
<script>
(function(){
"use strict";
var T=window.Tides;
function el(id){return document.getElementById(id);}
function c2(ms){return T.fmtT(ms).replace("am","a").replace("pm","p");}
function stripHTML(M,k,n){
  var first=M.series[0].ms,h='<div class="strip">';
  for(var b=0;b<4;b++){
    var si=T.slotInfo(M,k,b),cls="slot",style="",val;
    if(si.over.length)style="background:var(--"+T.stateFor(si.worst).cls+"-bg)";
    if(si.starts.length){var c=si.starts[0];val='<div class="sv">'+(c.s===first?"until "+c2(c.e):c2(c.s))+'</div>';}
    else if(si.over.length)val='<div class="sv cont">until '+c2(si.over[0].e)+'</div>';
    else if(si.near.length){cls+=" near";val='<div class="sv cont">close call</div>';}
    else val='<div class="sv cl">clear</div>';
    if(si.z<=n)cls+=" past";
    h+='<div class="'+cls+'" style="'+style+'"><div class="si">'+T.slotIcon(b)+'</div><div class="sn">'+T.SLOTS[b].n+'</div>'+val+'</div>';
  }
  return h+'</div>';
}
function render(M){
  el("loading").hidden=true;el("err").hidden=true;el("status").hidden=false;el("key").hidden=false;
  el("status").innerHTML=T.statusLineHTML(M);
  var n=T.nowW(),today=T.dayStart(n),first=M.series[0].ms,html="";
  M.order.forEach(function(k){
    var items=T.upcomingForDay(M,k,n),cl=items.filter(function(i){return i.c;}).length,
        rel=k===today||k===today+T.DAY;
    html+='<section class="dcard"><div class="dch"><b>'+T.dayName(k,n)+'</b><span>'+
      T.fmtD(k,rel?{weekday:"short",month:"short",day:"numeric"}:{month:"short",day:"numeric"})+'</span></div>'+
      stripHTML(M,k,n)+'<div class="rows">';
    if(!cl){
      var hadEarlier=k===today&&M.closures.some(function(c){return T.dayStart(c.s)===k;});
      html+='<div class="clearnote">'+(hadEarlier?"No more closures today":"No closures — clear all day")+'</div>';
    }
    items.forEach(function(it){
      if(it.c){
        var c=it.c,inch=T.inchesOver(c),st=T.stateFor(inch);
        html+='<div class="row"><div><div class="when">'+(c.s===first?"until "+T.fmtT(c.e):T.rangeTxt(c.s,c.e))+'</div>'+
          '<div class="dur">'+(c.s<=n?"under water now · ":T.slotLabel(M,c).toLowerCase()+" · ")+T.fmtDur((c.e-c.s)/T.MIN)+'</div></div>'+
          '<span class="pill" style="background:var(--'+st.cls+'-bg)"><i class="dot" style="background:'+st.color+'"></i>'+T.depthTxt(inch)+'</span></div>';
      }else{
        var x=it.x;
        html+='<div class="row near"><div><div class="when">close call '+T.fmtT(x.ms)+'</div><div class="dur">could still wet the road</div></div>'+
          '<span class="pill nearpill">'+T.shortBy(x)+' short</span></div>';
      }
    });
    html+='</div>';
    var hi=T.highsHTML(M,k,n);if(hi)html+='<div class="hiline cardhi">'+hi+'</div>';
    html+='</section>';
  });
  el("days").innerHTML=html;
  el("fresh").innerHTML=T.freshHTML(M);
}
T.run({render:render,
  tick:function(M){el("status").innerHTML=T.statusLineHTML(M);},
  error:function(err,M){
    if(M){el("fresh").innerHTML=T.freshHTML(M,"couldn’t refresh — showing the last good data");return;}
    el("loading").hidden=true;el("err").hidden=false;el("err").innerHTML=T.errorHTML(err);}});
})();
</script>
</body>
</html>
