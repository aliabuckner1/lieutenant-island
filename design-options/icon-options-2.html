<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Icon options, round 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@700&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../site/base.css">
<style>
.wrap{max-width:1500px;margin:0 auto;padding:26px 20px 60px}
.wrap>h1{font-size:28px}
.lede{color:var(--ink-2);max-width:82ch;margin:8px 0 0;font-size:15px}
.lede a{color:var(--accent)}
.opt{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:center;margin-top:26px;padding:22px;background:var(--surface);border:1px solid var(--rule);border-radius:18px}
.opt .id{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.opt b.name{display:block;font-family:var(--display);font-size:20px;margin-top:2px}
.opt p{margin:6px 0 0;font-size:13.5px;color:var(--ink-2);max-width:62ch}
.big svg{width:200px;height:200px;border-radius:45px;display:block;box-shadow:var(--shadow)}
.uses{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end;margin-top:16px}
.cap{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:7px;letter-spacing:.05em}
.home{padding:16px 16px 18px;border-radius:24px;background:linear-gradient(160deg,#3b5a78,#7d6a8f 55%,#c48f7a);display:grid;grid-template-columns:repeat(3,60px);gap:18px 22px}
.app{display:flex;flex-direction:column;align-items:center;gap:5px}
.app i,.app svg{width:60px;height:60px;border-radius:13.5px;display:block}
.app span{font-family:-apple-system,"Public Sans",sans-serif;font-size:11px;color:#fff;text-shadow:0 1px 2px #0006;white-space:nowrap}
.tab{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--rule);border-radius:10px 10px 0 0;padding:8px 14px;font-size:13px;color:#333}
.tab svg{width:16px;height:16px;border-radius:3px}
.card{width:340px;height:178px;border-radius:12px;background:#E9EFF1;display:flex;align-items:center;gap:18px;padding:0 24px;box-sizing:border-box;border:1px solid var(--rule)}
.card svg{width:84px;height:84px;border-radius:19px;flex:none;box-shadow:0 4px 12px #0f20271f}
.card .e{font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:.14em;color:#63808B;text-transform:uppercase}
.card .t{font-family:var(--display);font-size:25px;font-weight:700;color:#0F2027;line-height:1.1;margin-top:3px;white-space:nowrap}
.card .s{font-size:12px;color:#33505B;margin-top:5px;line-height:1.3}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Lieutenant Island · design options</div>
  <h1>Icon options, round 2: blends</h1>
  <p class="lede">One bold subject in front of the place's colours, so the icon stays clear at small sizes but still feels like Lt. Island.
    Round 1 (today's icon plus options 1–4) is on the <a href="icon-options.html">first options page</a>. Nothing here is published.</p>
  <div id="list"></div>
</div>
<script>
(function(){
"use strict";
var n=0;
function wrap(inner){return '<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+inner+'</svg>';}
function wave(y){return 'M-20 '+y+'c34 0 34-30 68-30s34 30 68 30 34-30 68-30 34 30 68 30 34-30 68-30 34 30 68 30 34-30 68-30 34 30 68 30 34-30 68-30 34 30 68 30';}
/* the pastel dusk sky from the marsh photos, over a given height */
function duskSky(u,h){return '<linearGradient id="sky'+u+'" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="'+h+'">'+
  '<stop offset="0" stop-color="#5C82D8"/><stop offset=".62" stop-color="#AFB4DE"/><stop offset="1" stop-color="#F0D0BC"/></linearGradient>';}
function duskWater(u,y){return '<linearGradient id="wat'+u+'" gradientUnits="userSpaceOnUse" x1="0" y1="'+y+'" x2="0" y2="512">'+
  '<stop offset="0" stop-color="#9FA9D6"/><stop offset="1" stop-color="#2F4677"/></linearGradient>';}
function chevronsRight(x,y,s){return '<path d="M'+x+' '+y+'l'+(52*s)+' '+(40*s)+'-'+(52*s)+' '+(40*s)+'h'+(40*s)+'l'+(52*s)+'-'+(40*s)+'-'+(52*s)+'-'+(40*s)+'z" fill="#16191B"/>';}

var ART={
  /* A: option 4's sign and wave, in front of option 3's dusk */
  chevronDusk:function(u){return wrap('<defs>'+duskSky(u,356)+duskWater(u,340)+'</defs>'+
    '<rect width="512" height="512" fill="url(#sky'+u+')"/>'+
    '<path d="M0 318h512v18H0z" fill="#4A5838"/>'+
    '<rect x="244" y="236" width="24" height="150" fill="#2B2F3A"/>'+
    '<rect x="96" y="128" width="320" height="120" rx="22" fill="#F2C230"/>'+
    chevronsRight(150,148,1)+chevronsRight(236,148,1)+
    '<path d="'+wave(356)+'V512H-20Z" fill="url(#wat'+u+')"/>'+
    '<path d="'+wave(356)+'" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round"/>'+
    '<path d="'+wave(446)+'" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="16" stroke-linecap="round"/>');},

  /* B: option 1 cut down to four bold shapes */
  roadSimple:function(u){return wrap('<defs>'+duskSky(u,262)+
    '<linearGradient id="mar'+u+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9CB65A"/><stop offset="1" stop-color="#6A8834"/></linearGradient>'+
    '<linearGradient id="fld'+u+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9CDE2"/><stop offset="1" stop-color="#7C9BC0"/></linearGradient></defs>'+
    '<rect width="512" height="512" fill="url(#sky'+u+')"/>'+
    '<path d="M96 262c12-18 34-26 58-24 14-16 40-22 64-14 18-12 48-14 70-2 22-8 50-2 64 14 20 2 34 12 38 26z" fill="#2E4A37"/>'+
    '<rect y="260" width="512" height="252" fill="url(#mar'+u+')"/>'+
    '<path d="M238 260h36l190 252H48z" fill="#8A8D92"/>'+
    '<path d="'+wave(392)+'V512H-20Z" fill="url(#fld'+u+')"/>'+
    '<path d="'+wave(392)+'" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round"/>');},

  /* E: the aerial photo, flattened to a side view: arched bridge on pilings, golden marsh, tree line, big sky */
  aerial:function(u){
    var posts='',piles='',refl='',N=12;
    for(var i=0;i<=N;i++){var t=i/N,x=40+432*t,yd=336-132*t*(1-t);
      posts+='<path d="M'+x.toFixed(1)+' '+(yd-30).toFixed(1)+'V'+yd.toFixed(1)+'" stroke="#3B332C" stroke-width="8"/>';
      if(i%2===0&&i>0&&i<N){var h=392-(yd+26);
        piles+='<rect x="'+(x-10).toFixed(1)+'" y="'+(yd+24).toFixed(1)+'" width="20" height="'+(h+2).toFixed(1)+'" fill="#2C2622"/>';
        refl+='<rect x="'+(x-10).toFixed(1)+'" y="392" width="20" height="'+(h*.8).toFixed(1)+'" fill="#173257" fill-opacity=".4"/>';}}
    return wrap('<defs>'+
    '<linearGradient id="as'+u+'" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="262"><stop offset="0" stop-color="#1F63C6"/><stop offset="1" stop-color="#CFE2F4"/></linearGradient>'+
    '<linearGradient id="am'+u+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D6BE58"/><stop offset="1" stop-color="#A9A43F"/></linearGradient>'+
    '<linearGradient id="aw'+u+'" gradientUnits="userSpaceOnUse" x1="0" y1="318" x2="0" y2="512"><stop offset="0" stop-color="#86B6E2"/><stop offset="1" stop-color="#22578F"/></linearGradient></defs>'+
    '<rect width="512" height="512" fill="url(#as'+u+')"/>'+
    '<path d="M60 176c-2-30 30-46 54-34 10-30 58-36 76-8 26-10 54 6 54 34 22 2 30 24 18 34H66c-20-2-24-20-6-26z" fill="#fff" fill-opacity=".95"/>'+
    '<path d="M300 118c50-10 120-12 180-4M340 144c40-6 90-6 140 0" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="9" stroke-linecap="round"/>'+
    '<rect y="244" width="512" height="20" fill="#A9C6E0"/>'+
    '<path d="M300 262c6-12 22-18 40-16 12-10 34-12 50-8 16-6 40-6 56 2 18-4 40 2 50 12 8 2 16 6 16 10z" fill="#23402E"/>'+
    '<rect y="262" width="512" height="60" fill="url(#am'+u+')"/>'+
    '<path d="M0 286c60-6 140-4 210 2s130 4 180-2 90 0 122 2v10c-40-2-80-2-120 2s-120 4-190-2S60 294 0 298z" fill="#9CC0E2"/>'+
    '<rect y="320" width="512" height="192" fill="url(#aw'+u+')"/>'+refl+
    '<path d="M0 346L64 342L112 394L0 412Z" fill="#B9A546"/><path d="M512 324L448 340L404 394L512 406Z" fill="#B9A546"/>'+
    '<path d="M446 346L512 324V340L458 360Z" fill="#8E8E8A"/>'+
    '<path d="M396 394H250M200 404H120" stroke="#fff" stroke-opacity=".5" stroke-width="7" stroke-linecap="round"/>'+
    piles+'<path d="M40 336Q256 270 472 336L472 362Q256 296 40 362Z" fill="#4B4239"/>'+posts+
    '<path d="M40 306Q256 240 472 306" fill="none" stroke="#3B332C" stroke-width="12" stroke-linecap="round"/>'+
    '<path d="M0 448c60-10 130 6 180 30 30 14 50 24 60 34H0z" fill="#B9A546"/>');}
};

var OPTIONS=[
  {id:'A',key:'chevronDusk',name:'Chevron at dusk',about:'Option 4’s bold sign and wave in front of option 3’s pastel dusk, with a thin marsh line on the horizon. As clear as the chevron sign, but warmer and more Wellfleet.'},
  {id:'B',key:'roadSimple',name:'Road into the water, simplified',about:'Option 1 cut down to four bold shapes: dusk sky, the island’s silhouette, the road narrowing toward it, and the tide washing over its near end.'},
  {id:'E',key:'aerial',name:'The bridge from above',about:'From the aerial photo, turned to a side view: the low arched bridge on its pilings over the channel, golden marsh, the island’s tree line, and a big Cape sky.'}
];
document.getElementById('list').innerHTML=OPTIONS.map(function(o){
  var a=ART[o.key];
  return '<div class="opt"><div class="big">'+a('b'+(n++))+'</div><div>'+
    '<div class="id">Option '+o.id+'</div><b class="name">'+o.name+'</b><p>'+o.about+'</p>'+
    '<div class="uses">'+
      '<div><div class="home"><div class="app"><i style="background:#34c759"></i><span>Messages</span></div>'+
        '<div class="app">'+a('h'+(n++))+'<span>Island Tides</span></div><div class="app"><i style="background:#0a84ff"></i><span>Weather</span></div></div>'+
        '<div class="cap">home screen, real size</div></div>'+
      '<div><div class="tab">'+a('t'+(n++))+'Lt. Island Tides</div><div class="cap">browser tab</div></div>'+
      '<div><div class="card">'+a('c'+(n++))+'<div><div class="e">Wellfleet · Cape Cod</div><div class="t">Lt. Island Tides</div>'+
        '<div class="s">When the road is underwater, for the next 8 days</div></div></div><div class="cap">link preview</div></div>'+
    '</div></div></div>';
}).join('');
})();
</script>
</body>
</html>
